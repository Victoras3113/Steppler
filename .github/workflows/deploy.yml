# On every push to main: deploys the Supabase Edge Functions, then builds the app and publishes it to GitHub Pages.
# The Supabase project address and publishable key are in .env.production (they are public by design).
# Only one repository secret is needed: SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Check setup (see SETUP.md)
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          ref=$(grep '^VITE_SUPABASE_URL=' .env.production | sed -E 's#.*https://([a-z0-9]+)\.supabase\.co.*#\1#')
          if [ -z "$ref" ] || grep -q YOUR-PROJECT-REF .env.production; then
            echo "::error::Fill in .env.production with your Supabase project URL and publishable key."
            exit 1
          fi
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - name: Deploy functions
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api --yes
      # Apply database migrations (supabase/functions/_shared/migrations.ts) through the temporary db-migrate
      # function, then remove that function again so it isn't left online.
      - name: Apply database migrations
        run: |
          for i in 1 2 3; do
            out=$(curl -sS -X POST "https://$PROJECT_REF.supabase.co/functions/v1/db-migrate" -H "Content-Type: application/json" -d '{}') && echo "$out"
            echo "$out" | grep -q '"ok":true' && exit 0
            sleep 10
          done
          echo "::error::Database migration failed: $out"; exit 1
      - name: Remove migration function
        if: always()
        run: supabase functions delete db-migrate --project-ref "$PROJECT_REF" --yes || true

  site:
    runs-on: ubuntu-latest
    needs: functions
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          BASE_PATH: /  # served from the root of https://app.staplerdisponent.com
      # Publish the built site to the gh-pages branch (GitHub Pages source: "Deploy from a branch", gh-pages / root).
      - name: Publish to gh-pages branch
        run: |
          cd dist
          echo "app.staplerdisponent.com" > CNAME
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      # Also publish through GitHub Pages' Actions deployment (used while the Pages source is "GitHub Actions").
      - uses: actions/configure-pages@v6
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
